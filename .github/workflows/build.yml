# content/ · templates/ · static/ 가 바뀌어 push 되면 docs/ 를 다시 만들어 커밋한다.
# GitHub Pages 는 main 브랜치의 /docs 폴더를 소스로 쓰도록 설정한다.
#   저장소 Settings > Pages > Source: "Deploy from a branch" > main / docs
name: build-site

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "templates/**"
      - "static/**"
      - "site.json"
      - "build.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: docs 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "build: docs 재생성"
            git push
          fi
